<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Registration</title>
    <link rel="StyleSheet" href="style.css"
</head>
<body>
    <h1>Intern Registration</h1>
    <form action="" method="POST">
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fname">Full Name</label>
            <input type="text" id="fname" name="fname" required>
            <br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <br><br>


            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" minlength="8">
            <br><br>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" maxlength="10">
            <br><br>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" >

        </fieldset>

        <!-- cousedetails -->
         <fieldset>
            <legend>Course Details</legend>
            <label>Gender:</label>
            <input type="radio" name="gender" value="male">
            <label>Male</label>

            <input type="radio" name="gender" value="female">
            <label>Female</label>

            <input type="radio" name="gender" value="other">
            <label>Other</label>

            <br><br>

            <label for="course">Course</label>
            <select id="course" name="course">
                <option>Web Development</option>
                <option>Python</option>
                <option>Java</option>
            </select>

            <br><br>

            <label>Skills:</label>
            <input type="checkbox" name="skills" value="html">
            <label>HTML</label>

            <input type="checkbox" name="skills" value="css">
            <label>CSS</label>

            <input type="checkbox" name="skills" value="javascript">
            <label>JavaScript</label>

            <br><br>

            <label for="addr"></label>
            <textarea id="addr" name="addr" rows="3"></textarea>

            <br><br>


         </fieldset>

         <br>
         <button type="submit">Register</button>

         <button type="reset">Clear</button>

    </form>
    <!-- JavaScript -->
    <script>
        const form = document.getElementById("registrationForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = new FormData(form);
            const name = formData.get("fname");
            const skills = formData.getAll("skills");

            message.textContent =
                "Registration successful! Welcome, " + name + ".";

            message.style.color = "green";

            console.log("Registration Details:");
            console.log("Name:", name);
            console.log("Email:", formData.get("email"));
            console.log("Phone:", formData.get("phone"));
            console.log("Date of Birth:", formData.get("dob"));
            console.log("Gender:", formData.get("gender"));
            console.log("Course:", formData.get("course"));
            console.log("Skills:", skills);
            console.log("Address:", formData.get("addr"));
        });
        form.addEventListener("reset", function() {
            message.textContent = "";
        });
    </script>
</body>
</html>
